[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "context-aware-engine"
version = "2.1.0"
description = "A Hybrid Fuzzy-Cognitive Context-Aware Recommendation Engine for Ambient Lifestyle Suggestions"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Mostafa Jaafari", email = "mostafa.jaafari@example.com"}
]
keywords = [
    "context-aware",
    "recommender-systems",
    "ambient-intelligence",
    "fuzzy-logic",
    "micro-context",
    "persian-culture",
    "colab-ready"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "numpy>=1.22.0",
    "matplotlib>=3.5.0",
    "pandas>=1.4.0",
    "ipywidgets>=7.7.0"
]

[project.urls]
Homepage = "https://github.com/mostafa-ja/contextAware"
Repository = "https://github.com/mostafa-ja/contextAware.git"
"Bug Tracker" = "https://github.com/mostafa-ja/contextAware/issues"
